<p id="pogrubienie_haratym"> Haratym 
Rosyjscy programiści stworzyli pierwszy program komputerowy, który w rozmowie po rosyjsku przeszedł pomyślnie test Turinga (test człowiek/maszyna). Algorytm był prosty. Na wszystkie pytania odpowiadał “A idź w pizdu!” <br></p>

<p id="pochylona_haratym">Haratym
- Czym różni się doświadczony informatyk od początkującego?
- Początkujący uważa, że 1KB to 1000B, a doświadczony jest pewnien, że 1km to 1024m.<br></p>

<p id="index_gorny_haratym">Haratym
Spotykają się dwaj programiści:
- Słuchaj, potrzebuję generatora liczb losowych
- Czternaście...<br></p>

<p id="index_dolny_haratym">Haratym
Rozmawia dwóch adminów:<br>
- Mój kumpel wczoraj w 5 minut uszkodził główny serwer.<br>
- Jest hakerem ?<br>
- Nie, debilem...<br></p>

<p id="mono_haratym">Haratym
- No, takiego wirusa to ja jeszcze nie miałem! - rzekł zięć informatyk, widząc teściową przy swoim komputerze...<br></p>

<p id="powiekszenie_haratym">Haratym
Impreza informatyków. Wódka leje się szerokopasmowym strumieniem.<br>
Dwóch adminów pije bruderszafta:<br>
- To co? Mówmy sobie po IP!<br></p>

<p id="pomniejszenie_haratym">Haratym
Dzieci piszą wypracowanie na temat: Jak wyobrażam sobie bycie informatykiem? Nie pisze tylko Jaś.<br>
- Dlaczego nie piszesz? - pyta polonistka.<br>
- Czekam, aż mi się otworzy edytor tekstu.<br></p>
