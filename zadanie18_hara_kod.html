<span style="font-size: 1.1cm;font-family: Times New Roman;"> 
<b><u> Element blokowy (DIV)</u></b> jest elementem blokowym może zawierać 
wewnątrz siebie zwykły            tekst, jak również inne elementy blokowe. Został on 
pomyślany do tworzenia obszerniejszych struktur.     
</span> 
<span style="color: purple;font-family: Arial, Helvetica, sans-serif; font-size: 0.7cm;"><br /> 
             Zastosowanie DIV 
<ul type="square"> 
<li> 
                  Z div'a powinno się korzystać kiedy potrzebujemy wyodrębnić poszczególne 
bloki w układzie dokumentu, na przykład lewa kolumna,                       menu nawigacyjne, 
stopka. 
</li> 
<li>Służy do utworzenia sekcji (bloku) w pliku HTML w celu ich sformatowania za pomocą 
arkusza stylów CSS.</li> 
</ul> 
</span>

<!--    początekbloku DIV  2       --> 
<div style="background-color: red; width: 1085px">

<br /> 
<span style="color: purple;font-family: Arial, Helvetica, sans-serif; font-size: 8mm;"><br />            
<ul type="filled circle"> 
<li> 
Elementy wyświetlanie w linii (SPAN)
jest elementem liniowym
nie mogą zawierać 
elementów blokowych, ale mogą inne elementy wyświetlane w linii oraz zwykły tekst.  
</li> 
<li>
Jeśli chcemy w paragrafie część tekstu wyróżnić czerwonym kolorem, do 
wyodrębnienia tego tekstu nie możemy użyć elementu div (paragraf z zasady nie 
może zawierać elementów blokowych) tylko span. 
Wewnątrz DIV można oczywiście wpisać również SPAN.
</li> 
</ul> 
</span> 
</div>
