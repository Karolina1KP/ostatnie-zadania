 <p> H - nagłówek, może mieć wielkość od 6 (najmniejsze) do 1 (największe)</p>

<p> Kaskadowość stylów określa pierwszeństwo w oddziaływaniu na te same elementy strony 
stylów z różnych źródeł (lokalny, zewnętrzny, wewnętrzny itp.). Style tworzą hierarchię 
tworząc kaskadę dlatego taka nazwa. </p>

<h1>CSS są piękne</h1>

<p>Kolejnym pseudoelementem jest :first-line, który w przeciwieństwie do 
poprzednika obejmuje formatowaniem całą pierwszą linię, a nie tylko pierwszą literę.</p>
