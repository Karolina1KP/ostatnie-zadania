<p>Haratym
Każda cecha ma ściśle wyszczególnioną listę wartości, które może przyjąć.  
Na przykład: cecha text-align (wyrównanie tekstu) może być przypisana tylko i wyłącznie do 
elementów blokowych, ponieważ podanie jej dla elementów wyświetlanych w linii nie 
miałoby sensu. Z drugiej strony cecha ta może przyjmować tylko wartości takie jak: left, 
right, center, justify. Przypisanie do niej np. wartości koloru nie miałoby sensu.</p>

<p id="gruby_haratym">Haratym
Z drzewem dokumentu związana jest własność dziedziczności stylów. Polega ona na tym, że 
elementy leżące niżej w hierarchii (potomkowie), jeśli nie zaznaczymy inaczej, dziedziczą 
(przejmują) atrybuty formatowania, które zostały nadane ich przodkom. </p>

<h1 id="dlawszystkich_haratym"> Haratym<br>
Można świadomie zmienić zasady kaskadowości. Służy do tego polecenie !important. Jeżeli 
pojawi się ono w deklaracji stylu po wartości cechy, spowoduje to, że taka cecha będzie miała 
pierwszeństwo przed innymi, nawet jeśli ma niższy priorytet. Natomiast inne cechy takiej 
deklaracji będą interpretowane normalnie, chyba że również przy nich postawimy !important. 
Nie należy jednak przesadzać ze stosowaniem tej metody, ponieważ jawnie łamie ona zasadę 
kaskadowości i po jakimś czasie może Ci znacznie utrudnić analizę sposobu formatowania 
elementów. </h1>

<div id="dlawszystkich_haratym">
Haratym
Selektorem może być praktycznie dowolny znacznik, np. p (akapit), h1 (tytuł), td (komórka 
tabeli) i inne. To właśnie elementom, które znajdują się w kodzie źródłowym, pomiędzy tymi 
znacznikami, nadajemy atrybuty formatowania opisane w arkuszu. 
Jako "cecha" (w deklaracji stylu - powyżej) należy wpisać o jakie konkretnie atrybuty 
formatowania nam chodzi (opisane w kolejnych rozdziałach). 
Natomiast jako wyraz "wartość" wpisujemy dokładną wartość atrybutu.
</div>
